[runtime]
provider = trt
precision = fp16
gpu_threads = 1
cpu_threads = 4

[paths]
models_root = model_assets
engines_root = engines
output_dir = output
tmp_dir = tmp

[ui]
theme = dark
last_workspace = workspace/default.json
auto_load_workspace = true

[download]
mirror = huggingface
concurrent = 2
retries = 3

[advanced]
batch_synchronize = true
batch_faces = true
enable_cuda_graph = false
trt_workspace_mb = 4096
engine_cache_layout = per_gpu

